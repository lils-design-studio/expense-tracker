<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2454/2454282.png">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2454/2454282.png">
    <title>Expense Tracker</title>
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg: #f8fafd;
            --card: #ffffff;
            --text-main: #2d3436;
            --text-sub: #636e72;
            --border: #edf2f7;
            --ocean-blue: #0ea5e9;
            --danger-red: #dc2626;
            --pastel-1: #FFCFD2; --pastel-2: #F1C0E8; --pastel-3: #CFBAF0;
            --pastel-4: #A3C4F3; --pastel-5: #90DBF4; --pastel-6: #8EECF5;
            --pastel-7: #B9FBC0; --pastel-8: #FBF8CC; --pastel-9: #FFE5D9;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); color: var(--text-main); margin: 0; padding: 20px;
            line-height: 1.4; padding-bottom: 60px;
        }

        .container { max-width: 450px; margin: 0 auto; }
        
        header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.4rem; font-weight: 800; margin: 0; color: var(--text-main); }

        /* Budget Bars */
        .budget-stack { margin-bottom: 30px; }
        .budget-row { 
            background: var(--card); padding: 16px; border-radius: 18px; 
            margin-bottom: 12px; border: 1px solid var(--border);
            cursor: grab; transition: transform 0.2s;
        }
        .budget-row:active { cursor: grabbing; transform: scale(0.98); }
        .budget-info { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px; }
        .budget-name { font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }
        .budget-values { font-size: 0.85rem; font-weight: 600; }
        .budget-values span { color: var(--text-sub); font-weight: 400; font-size: 0.75rem; }
        
        .progress-bg { height: 10px; background: #f1f1f1; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 0.8s ease-out; }

        /* Form */
        .form-card { background: var(--card); border-radius: 24px; padding: 20px; border: 1px solid var(--border); margin-bottom: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        label { display: block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--text-sub); margin-bottom: 6px; }
        
        input, select { 
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 12px;
            font-size: 1rem; margin-bottom: 16px; background: #fcfcfc; outline: none;
        }

        .tag-cloud { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
        .tag-pill { 
            background: #fff; border: 1px solid var(--border); padding: 5px 12px; 
            border-radius: 20px; font-size: 0.75rem; cursor: pointer; color: var(--text-sub);
        }

        button.primary { 
            width: 100%; padding: 16px; border-radius: 14px; border: none;
            background: var(--ocean-blue); color: white; font-weight: 700; font-size: 1rem;
        }

        /* Activities */
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .history-item { 
            background: var(--card); padding: 15px; border-radius: 16px; border: 1px solid var(--border);
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .hist-desc { font-weight: 700; font-size: 0.95rem; margin-bottom: 2px; display: block; }
        .hist-meta { font-size: 0.7rem; color: var(--text-sub); display: flex; gap: 5px; }
        .hist-amt { font-weight: 800; font-size: 1rem; color: var(--danger-red); }
        .hist-actions { display: flex; gap: 12px; margin-left: 10px; }

        /* Modal Overlay */
        .modal { 
            display: none; position: fixed; inset: 0; background: var(--bg); 
            z-index: 100; padding: 20px; overflow-y: auto; padding-top: 60px;
        }
        .close-x { 
            position: fixed; top: 20px; right: 20px; font-size: 1.5rem; 
            font-weight: 300; cursor: pointer; width: 40px; height: 40px; 
            display: flex; align-items: center; justify-content: center;
        }

        /* Footer */
        .sync-section { margin-top: 40px; padding: 20px; border-top: 2px dashed #eee; text-align: center; }
        .sync-btns { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .sync-btns button { flex: 1; min-width: 100px; padding: 10px; font-size: 0.7rem; border-radius: 10px; background: #eee; border:none; font-weight: 600;}

        .btn-text-del { background: none; border: none; color: var(--danger-red); font-size: 0.8rem; font-weight: 600; cursor: pointer; padding: 10px; }

        .pagination { display: flex; justify-content: center; gap: 15px; align-items: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Expense Tracker</h1>
        <button onclick="openWeeklyLog()" style="background:none; border:none; font-size:0.7rem; text-decoration:underline; color:var(--text-sub)">Weekly Log</button>
    </header>

    <!-- Budgets Draggable Stack -->
    <div id="budget-stack" class="budget-stack"></div>

    <!-- Add Expense -->
    <div class="form-card">
        <label>Amount</label>
        <input type="number" id="exp-amount" placeholder="0.00" inputmode="decimal">

        <label>Description</label>
        <input type="text" id="exp-note" placeholder="Coffee with friends...">
        
        <label>Quick Tags</label>
        <div id="quick-tags" class="tag-cloud"></div>

        <label>Category</label>
        <select id="exp-category"></select>
        
        <button class="primary" onclick="addExpense()">Add Expense</button>
    </div>

    <!-- Recent Activities -->
    <div class="history-header">
        <label style="margin:0">Recent Activities</label>
        <select id="filter-cat" style="width: auto; margin:0; padding: 5px; font-size: 0.7rem;" onchange="renderHistory(0)">
            <option value="all">All</option>
        </select>
    </div>
    
    <div id="history-list"></div>
    <div id="pagination-controls" class="pagination"></div>

    <button class="primary" style="margin-top:40px; background:#f0f0f0; color:#000" onclick="openBudgetModal()">+ New Category</button>

    <!-- Original Sync Footer -->
    <div class="sync-section">
        <label>Data & Sync</label>
        <div class="sync-btns">
            <button onclick="exportToCSV()">Export CSV</button>
            <button onclick="exportBackup()">Backup File</button>
            <button onclick="document.getElementById('importFile').click()">Restore</button>
        </div>
        <input type="file" id="importFile" style="display:none" onchange="importBackup(event)" accept=".json">
        <button class="btn-text-del" onclick="resetAll()">Clear All Data</button>
    </div>
</div>

<!-- Category / Transaction Detail Modal -->
<div id="budgetModal" class="modal">
    <div class="close-x" onclick="closeModal()">&times;</div>
    <div style="max-width:400px; margin:0 auto;">
        <h2 id="modal-title">Category Details</h2>
        <input type="hidden" id="edit-id">
        
        <!-- Category Transactions -->
        <div id="category-transactions-view" style="margin-bottom: 30px;"></div>

        <hr style="border: 0; border-top: 1px solid var(--border); margin: 30px 0;">

        <label>Category Name</label>
        <input type="text" id="cat-name">
        <label>Weekly Limit ($)</label>
        <input type="number" id="cat-limit" inputmode="decimal">
        <label>Color & Icon</label>
        <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:10px; margin-bottom:15px;" id="color-picker"></div>
        <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:10px; margin-bottom:15px;" id="icon-picker"></div>
        
        <button class="primary" onclick="saveBudget()" id="save-budget-btn">Save Changes</button>
        <div style="text-align: center; margin-top: 15px;">
            <button class="btn-text-del" id="delete-btn" onclick="deleteBudget()">Delete Category</button>
        </div>
    </div>
</div>

<!-- Weekly Log Modal -->
<div id="weeklyLogModal" class="modal">
    <div class="close-x" onclick="closeModal()">&times;</div>
    <div style="max-width:400px; margin:0 auto;">
        <h2>Weekly History</h2>
        <p style="font-size: 0.8rem; color: var(--text-sub);">Review your carry-over balances by week.</p>
        <div id="weekly-log-content"></div>
    </div>
</div>

<script>
    const COLORS = ['#FFCFD2', '#F1C0E8', '#CFBAF0', '#A3C4F3', '#90DBF4', '#8EECF5', '#B9FBC0', '#FBF8CC', '#FFE5D9', '#E2E2E2'];
    const ICONS = ['💰', '🍱', '☕️', '🏠', '🚗', '🛍️', '💊', '🎮', '💡', '✨'];
    
    let state = {
        budgets: [],
        expenses: [],
        lastWeeklyReset: null,
        currentYear: new Date().getFullYear(),
        selectedColor: COLORS[0],
        selectedIcon: ICONS[0],
        currentPage: 0
    };

    function init() {
        const saved = localStorage.getItem('expense_tracker_v4');
        if (saved) state = JSON.parse(saved);
        if (state.budgets.length === 0) {
            state.budgets = [{ id: 1, name: 'General', limit: 100, balance: 100, color: COLORS[0], icon: ICONS[0] }];
        }
        setupPickers();
        checkTimeframes();
        renderAll();
        initSortable();
    }

    function initSortable() {
        const el = document.getElementById('budget-stack');
        Sortable.create(el, {
            animation: 150,
            onEnd: function (evt) {
                const movedItem = state.budgets.splice(evt.oldIndex, 1)[0];
                state.budgets.splice(evt.newIndex, 0, movedItem);
                save();
            }
        });
    }

    function checkTimeframes() {
        const now = new Date();
        const lastReset = state.lastWeeklyReset ? new Date(state.lastWeeklyReset) : now;
        const diff = now - lastReset;
        const weeksPassed = Math.floor(diff / (1000 * 60 * 60 * 24 * 7));

        if (weeksPassed > 0 || !state.lastWeeklyReset) {
            state.budgets.forEach(b => {
                b.balance = Number(b.balance) + (Number(b.limit) * (weeksPassed || 1));
            });
            state.lastWeeklyReset = now.toISOString();
            save();
        }
    }

    // --- Actions ---

    function addExpense() {
        const amt = parseFloat(document.getElementById('exp-amount').value);
        const catId = parseInt(document.getElementById('exp-category').value);
        const note = document.getElementById('exp-note').value;
        if (!amt || !catId) return;

        state.expenses.unshift({ id: Date.now(), amt, catId, note, date: new Date().toISOString() });
        state.budgets.find(b => b.id === catId).balance -= amt;

        document.getElementById('exp-amount').value = '';
        document.getElementById('exp-note').value = '';
        save(); renderAll();
    }

    function deleteExpense(id) {
        if (!confirm("Delete this entry?")) return;
        const idx = state.expenses.findIndex(e => e.id === id);
        const exp = state.expenses[idx];
        const cat = state.budgets.find(b => b.id === exp.catId);
        if (cat) cat.balance += exp.amt;
        state.expenses.splice(idx, 1);
        save(); renderAll();
        if(document.getElementById('budgetModal').style.display === 'block') {
            openBudgetModal(exp.catId);
        }
    }

    function editExpense(id) {
        const exp = state.expenses.find(e => e.id === id);
        const newAmt = prompt("New Amount:", exp.amt);
        if (newAmt === null) return;
        const newNote = prompt("New Description:", exp.note);
        
        const cat = state.budgets.find(b => b.id === exp.catId);
        cat.balance += exp.amt; // refund
        exp.amt = parseFloat(newAmt);
        exp.note = newNote;
        cat.balance -= exp.amt; // charge new
        
        save(); renderAll();
    }

    // --- UI Rendering ---

    function renderAll() {
        renderBudgets();
        renderQuickTags();
        renderHistory(0);
        document.getElementById('exp-category').innerHTML = state.budgets.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
        document.getElementById('filter-cat').innerHTML = '<option value="all">All</option>' + state.budgets.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
    }

    function renderBudgets() {
        const stack = document.getElementById('budget-stack');
        stack.innerHTML = state.budgets.map((b) => {
            const perc = Math.max(0, Math.min(100, (b.balance / b.limit) * 100));
            return `
                <div class="budget-row" onclick="openBudgetModal(${b.id})">
                    <div class="budget-info">
                        <div class="budget-name">${b.icon} ${b.name}</div>
                        <div class="budget-values">$${b.balance.toFixed(0)} <span>/ $${b.limit}w</span></div>
                    </div>
                    <div class="progress-bg">
                        <div class="progress-fill" style="width: ${perc}%; background: ${b.color}"></div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderHistory(page) {
        state.currentPage = page;
        const filterId = document.getElementById('filter-cat').value;
        const filtered = state.expenses.filter(e => filterId === 'all' || e.catId == filterId);
        const slice = filtered.slice(page * 7, (page * 7) + 7);
        
        document.getElementById('history-list').innerHTML = slice.map(e => {
            const cat = state.budgets.find(b => b.id === e.catId);
            const desc = e.note.replace(/#\w+/g, '').trim() || 'Expense';
            const tags = (e.note.match(/#\w+/g) || []).map(t => `<span style="color:var(--ocean-blue); margin-right:4px;">${t}</span>`).join('');
            return `
                <div class="history-item">
                    <div style="flex:1">
                        <span class="hist-desc">${desc}</span>
                        <div class="hist-meta">
                            <span style="color:var(--text-main)">${cat ? cat.name : ''}</span> • ${new Date(e.date).toLocaleDateString()}
                        </div>
                        <div style="font-size:0.7rem; margin-top:4px;">${tags}</div>
                    </div>
                    <div style="text-align:right">
                        <div class="hist-amt">-$${e.amt.toFixed(2)}</div>
                        <div class="hist-actions">
                            <span onclick="editExpense(${e.id})">✏️</span>
                            <span onclick="deleteExpense(${e.id})">🗑️</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        document.getElementById('pagination-controls').innerHTML = `
            <button onclick="renderHistory(${page-1})" ${page === 0 ? 'style="opacity:0"' : ''} class="sync-btns">Prev</button>
            <span style="font-size:0.75rem">Page ${page + 1}</span>
            <button onclick="renderHistory(${page+1})" ${ (page+1)*7 >= filtered.length ? 'style="opacity:0"' : ''} class="sync-btns">Next</button>
        `;
    }

    function renderQuickTags() {
        const counts = {};
        state.expenses.forEach(e => {
            (e.note.match(/#\w+/g) || []).forEach(t => counts[t] = (counts[t] || 0) + 1);
        });
        const top = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 8).map(i => i[0]);
        document.getElementById('quick-tags').innerHTML = top.map(t => `<div class="tag-pill" onclick="appendTag('${t}')">${t}</div>`).join('');
    }

    function openBudgetModal(id = null) {
        document.getElementById('budgetModal').style.display = 'block';
        const transView = document.getElementById('category-transactions-view');
        
        if (id) {
            const b = state.budgets.find(x => x.id == id);
            document.getElementById('edit-id').value = b.id;
            document.getElementById('cat-name').value = b.name;
            document.getElementById('cat-limit').value = b.limit;
            document.getElementById('delete-btn').style.display = 'inline-block';
            
            // Show this category's transactions
            const catExp = state.expenses.filter(e => e.catId == id).slice(0, 5);
            transView.innerHTML = `<label>Category Activity</label>` + (catExp.length ? catExp.map(e => `
                <div style="display:flex; justify-content:space-between; font-size:0.85rem; padding:8px 0; border-bottom:1px solid #f9f9f9">
                    <span>${e.note.substring(0,20)}</span>
                    <span style="font-weight:700">-$${e.amt}</span>
                </div>
            `).join('') : '<p style="font-size:0.8rem; color:#ccc">No activity yet</p>');
        } else {
            document.getElementById('edit-id').value = '';
            document.getElementById('cat-name').value = '';
            document.getElementById('cat-limit').value = '';
            document.getElementById('delete-btn').style.display = 'none';
            transView.innerHTML = '';
        }
    }

    function openWeeklyLog() {
        document.getElementById('weeklyLogModal').style.display = 'block';
        const log = document.getElementById('weekly-log-content');
        // Simple logic to show a simulated 4-week history
        let html = '';
        const start = state.lastWeeklyReset ? new Date(state.lastWeeklyReset) : new Date();
        for(let i=0; i<5; i++) {
            let d = new Date(start);
            d.setDate(d.getDate() - (i * 7));
            html += `
                <div style="padding:15px; background:#fff; border-radius:12px; margin-bottom:10px; border:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-weight:700; font-size:0.8rem">${d.toLocaleDateString()} Log</span>
                    <span style="color:var(--ocean-blue); font-size:0.8rem">Auto-Carry Active</span>
                </div>
            `;
        }
        log.innerHTML = html;
    }

    // --- Helpers ---
    function setupPickers() {
        const cp = document.getElementById('color-picker');
        cp.innerHTML = COLORS.map(c => `<div onclick="state.selectedColor='${c}'" style="background:${c}; height:30px; border-radius:8px;"></div>`).join('');
        const ip = document.getElementById('icon-picker');
        ip.innerHTML = ICONS.map(i => `<div onclick="state.selectedIcon='${i}'" style="background:#eee; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:0.8rem;">${i}</div>`).join('');
    }

    function saveBudget() {
        const id = document.getElementById('edit-id').value;
        const name = document.getElementById('cat-name').value;
        const limit = parseFloat(document.getElementById('cat-limit').value);
        if (id) {
            const b = state.budgets.find(x => x.id == id);
            Object.assign(b, { name, limit, color: state.selectedColor, icon: state.selectedIcon });
        } else {
            state.budgets.push({ id: Date.now(), name, limit, balance: limit, color: state.selectedColor, icon: state.selectedIcon });
        }
        closeModal(); save(); renderAll();
    }

    function deleteBudget() {
        if(confirm("Delete entire category?")) {
            state.budgets = state.budgets.filter(b => b.id != document.getElementById('edit-id').value);
            closeModal(); save(); renderAll();
        }
    }

    function closeModal() { 
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); 
    }

    function appendTag(tag) {
        document.getElementById('exp-note').value += ` ${tag} `;
    }

    function save() { localStorage.setItem('expense_tracker_v4', JSON.stringify(state)); }

    function resetAll() { if(confirm("Permanently clear all data?")) { localStorage.clear(); location.reload(); } }

    function exportToCSV() {
        let csv = "Date,Category,Amount,Description\n";
        state.expenses.forEach(e => {
            const cat = state.budgets.find(b => b.id === e.catId);
            csv += `${new Date(e.date).toLocaleDateString()},${cat ? cat.name : ''},${e.amt},"${e.note.replace(/"/g, '""')}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'expenses.csv';
        a.click();
    }

    function exportBackup() {
        const blob = new Blob([JSON.stringify(state)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `backup-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
    }

    function importBackup(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (event) => {
            state = JSON.parse(event.target.result);
            save(); location.reload();
        };
        reader.readAsText(file);
    }

    init();
</script>
</body>
</html>
