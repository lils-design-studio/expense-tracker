<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>VibeBudget Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #fdfdfd;
            --card: #ffffff;
            --text-main: #1a1a1a;
            --text-sub: #737373;
            --border: #f0f0f0;
            --safe: #10b981;
            --danger: #ef4444;
            --accent: #6366f1;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); color: var(--text-main); margin: 0; padding: 20px;
            line-height: 1.5; padding-bottom: 80px;
        }

        .container { max-width: 450px; margin: 0 auto; }
        
        header { margin-bottom: 30px; margin-top: 20px; }
        h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.5px; margin: 0; }
        .year-indicator { font-size: 0.8rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; }

        .card { 
            background: var(--card); border-radius: 24px; padding: 24px; 
            border: 1px solid var(--border); margin-bottom: 16px;
        }

        .summary-val { font-size: 2.5rem; font-weight: 800; margin: 5px 0; letter-spacing: -1px; }
        
        .grid-budgets { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .budget-tile { 
            padding: 16px; border-radius: 20px; border: 1px solid var(--border);
            position: relative; overflow: hidden; transition: transform 0.1s;
        }
        .budget-tile:active { transform: scale(0.97); }
        .tile-icon { font-size: 1.2rem; margin-bottom: 8px; display: block; }
        .tile-name { font-size: 0.85rem; font-weight: 600; color: var(--text-sub); }
        .tile-amt { font-size: 1.1rem; font-weight: 700; display: block; }

        label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 8px; color: var(--text-sub); text-transform: uppercase; }
        
        input, select { 
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border);
            font-size: 1rem; margin-bottom: 12px; background: #fafafa;
        }

        button { 
            width: 100%; padding: 16px; border-radius: 16px; border: none;
            font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.2s;
            background: var(--text-main); color: white;
        }
        button.secondary { background: #f0f0f0; color: var(--text-main); margin-top: 8px; }
        button.ghost { background: transparent; color: var(--text-sub); font-size: 0.8rem; text-decoration: underline; margin-top: 10px; }

        .picker-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 15px; }
        .pick-item { 
            aspect-ratio: 1; border-radius: 10px; border: 2px solid transparent;
            display: flex; align-items: center; justify-content: center; cursor: pointer; background: #f5f5f5;
        }
        .pick-item.active { border-color: var(--text-main); background: #fff; }

        .modal { 
            display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.98); 
            z-index: 100; padding: 20px; overflow-y: auto;
        }
        .modal-content { max-width: 400px; margin: 40px auto; }

        .history-item { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid var(--border);
        }
        
        .tag { font-size: 0.7rem; background: #eee; padding: 2px 6px; border-radius: 4px; margin-right: 4px; }

        .sync-section {
            margin-top: 40px; padding: 20px; border-top: 2px dashed var(--border); text-align: center;
        }
        .sync-btns { display: flex; gap: 10px; margin-top: 10px; }
        .sync-btns button { padding: 10px; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="year-indicator" id="year-label">2024 Budget Cycle</span>
        <h1>Current Balance</h1>
        <div class="summary-val" id="total-remaining">$0.00</div>
    </header>

    <div class="card" style="padding: 10px; border: none;">
        <canvas id="budgetChart" height="140"></canvas>
    </div>

    <div class="card">
        <label>Add Expense</label>
        <div style="display: flex; gap: 8px;">
            <input type="number" id="exp-amount" placeholder="0.00" inputmode="decimal" style="flex: 1; margin-bottom: 0;">
            <select id="exp-category" style="flex: 1; margin-bottom: 0;"></select>
        </div>
        <input type="text" id="exp-note" placeholder="Tags #food #coffee..." style="margin-top: 12px;">
        <button onclick="addExpense()">Track Expense</button>
    </div>

    <label>Your Budgets</label>
    <div id="budget-grid" class="grid-budgets"></div>

    <button class="secondary" onclick="openBudgetModal()">+ Create New Budget</button>

    <div id="history-list" style="margin-top: 30px;"></div>

    <!-- Data Management Section -->
    <div class="sync-section">
        <label>Data & Sync</label>
        <div class="sync-btns">
            <button class="secondary" onclick="exportToCSV()">Export CSV</button>
            <button class="secondary" onclick="exportBackup()">Backup File</button>
            <button class="secondary" onclick="document.getElementById('importFile').click()">Restore</button>
        </div>
        <input type="file" id="importFile" style="display:none" onchange="importBackup(event)" accept=".json">
        <button class="ghost" onclick="resetAll()" style="color: var(--danger)">Clear All Data</button>
    </div>
</div>

<!-- Yearly Reset Modal -->
<div id="yearModal" class="modal">
    <div class="modal-content">
        <h1>Happy New Year!</h1>
        <p>The year has ended. Would you like to carry your current balances into the new year, or start fresh with your base weekly limits?</p>
        <button onclick="handleYearReset(true)">Carry Over Balances</button>
        <button class="secondary" onclick="handleYearReset(false)">Start Fresh</button>
    </div>
</div>

<!-- Manage Budget Modal -->
<div id="budgetModal" class="modal">
    <div class="modal-content">
        <h2 id="modal-title">New Budget</h2>
        <input type="hidden" id="edit-id">
        <label>Category Name</label>
        <input type="text" id="cat-name" placeholder="e.g. Groceries">
        <label>Weekly Limit ($)</label>
        <input type="number" id="cat-limit" placeholder="100" inputmode="decimal">
        <label>Color</label>
        <div class="picker-grid" id="color-picker"></div>
        <label>Icon</label>
        <div class="picker-grid" id="icon-picker"></div>
        <button onclick="saveBudget()">Save Budget</button>
        <button id="delete-btn" class="secondary" style="color: var(--danger); display: none;" onclick="deleteBudget()">Delete Budget</button>
        <button class="ghost" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>
    const COLORS = ['#FFCFD2', '#F1C0E8', '#CFBAF0', '#A3C4F3', '#90DBF4', '#8EECF5', '#B9FBC0', '#FBF8CC', '#FFE5D9', '#E2E2E2'];
    const ICONS = ['💰', '🍱', '☕️', '🏠', '🚗', '🛍️', '💊', '🎮', '💡', '✨'];
    
    let state = {
        budgets: [],
        expenses: [],
        lastWeeklyReset: null,
        currentYear: new Date().getFullYear(),
        selectedColor: COLORS[0],
        selectedIcon: ICONS[0]
    };

    function init() {
        const saved = localStorage.getItem('vibebudget_v2');
        if (saved) state = JSON.parse(saved);
        setupPickers();
        checkTimeframes();
        render();
    }

    function setupPickers() {
        const cp = document.getElementById('color-picker');
        cp.innerHTML = COLORS.map(c => `<div class="pick-item" style="background:${c}" onclick="selectColor('${c}', this)"></div>`).join('');
        const ip = document.getElementById('icon-picker');
        ip.innerHTML = ICONS.map(i => `<div class="pick-item" onclick="selectIcon('${i}', this)">${i}</div>`).join('');
    }

    function selectColor(c, el) {
        state.selectedColor = c;
        document.querySelectorAll('#color-picker .pick-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    }

    function selectIcon(i, el) {
        state.selectedIcon = i;
        document.querySelectorAll('#icon-picker .pick-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    }

    function checkTimeframes() {
        const now = new Date();
        if (now.getFullYear() > state.currentYear) {
            document.getElementById('yearModal').style.display = 'block';
            return;
        }
        const lastReset = state.lastWeeklyReset ? new Date(state.lastWeeklyReset) : now;
        const weeksPassed = Math.floor((now - lastReset) / (1000 * 60 * 60 * 24 * 7));
        if (weeksPassed > 0 || !state.lastWeeklyReset) {
            state.budgets.forEach(b => b.balance = Number(b.balance) + (Number(b.limit) * (weeksPassed || 1)));
            state.lastWeeklyReset = now.toISOString();
            save();
        }
    }

    function handleYearReset(carryOver) {
        state.currentYear = new Date().getFullYear();
        if (!carryOver) {
            state.budgets.forEach(b => b.balance = b.limit);
            state.expenses = [];
        }
        document.getElementById('yearModal').style.display = 'none';
        save(); render();
    }

    function saveBudget() {
        const id = document.getElementById('edit-id').value;
        const name = document.getElementById('cat-name').value;
        const limit = parseFloat(document.getElementById('cat-limit').value);
        if (!name || isNaN(limit)) return;
        if (id) {
            const b = state.budgets.find(x => x.id == id);
            Object.assign(b, { name, limit, icon: state.selectedIcon, color: state.selectedColor });
        } else {
            state.budgets.push({ id: Date.now(), name, limit, balance: limit, icon: state.selectedIcon, color: state.selectedColor });
        }
        closeModal(); save(); render();
    }

    function deleteBudget() {
        const id = document.getElementById('edit-id').value;
        if(confirm("Delete budget?")) {
            state.budgets = state.budgets.filter(b => b.id != id);
            state.expenses = state.expenses.filter(e => e.catId != id);
            closeModal(); save(); render();
        }
    }

    function addExpense() {
        const amt = parseFloat(document.getElementById('exp-amount').value);
        const catId = parseInt(document.getElementById('exp-category').value);
        const note = document.getElementById('exp-note').value;
        if (!amt || !catId) return;
        state.expenses.unshift({ id: Date.now(), amt, catId, note, date: new Date().toISOString() });
        state.budgets.find(b => b.id === catId).balance -= amt;
        document.getElementById('exp-amount').value = '';
        document.getElementById('exp-note').value = '';
        save(); render();
    }

    // --- DATA & EXPORT FUNCTIONS ---

    function exportToCSV() {
        let csv = "Date,Category,Amount,Note,Tags\n";
        state.expenses.forEach(e => {
            const cat = state.budgets.find(b => b.id === e.catId);
            const tags = (e.note.match(/#\w+/g) || []).join(' ');
            const noteClean = e.note.replace(/#\w+/g, '').replace(/,/g, '');
            csv += `${new Date(e.date).toLocaleDateString()},${cat ? cat.name : 'Deleted'},${e.amt},${noteClean},${tags}\n`;
        });
        downloadFile(csv, 'my-expenses.csv', 'text/csv');
    }

    function exportBackup() {
        const data = JSON.stringify(state);
        downloadFile(data, `vibe-budget-backup-${new Date().toLocaleDateString()}.json`, 'application/json');
    }

    function importBackup(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const imported = JSON.parse(e.target.result);
                if (confirm("This will overwrite all current data. Proceed?")) {
                    state = imported;
                    save();
                    location.reload();
                }
            } catch (err) { alert("Invalid backup file."); }
        };
        reader.readAsText(file);
    }

    function downloadFile(content, fileName, contentType) {
        const a = document.createElement("a");
        const file = new Blob([content], { type: contentType });
        a.href = URL.createObjectURL(file);
        a.download = fileName;
        a.click();
    }

    // --- UI RENDERING ---

    function openBudgetModal(id = null) {
        document.getElementById('budgetModal').style.display = 'block';
        if (id) {
            const b = state.budgets.find(x => x.id == id);
            document.getElementById('modal-title').innerText = "Edit Budget";
            document.getElementById('edit-id').value = b.id;
            document.getElementById('cat-name').value = b.name;
            document.getElementById('cat-limit').value = b.limit;
            document.getElementById('delete-btn').style.display = 'block';
        } else {
            document.getElementById('modal-title').innerText = "New Budget";
            document.getElementById('edit-id').value = '';
            document.getElementById('cat-name').value = '';
            document.getElementById('cat-limit').value = '';
            document.getElementById('delete-btn').style.display = 'none';
        }
    }

    function closeModal() { document.getElementById('budgetModal').style.display = 'none'; }
    function save() { localStorage.setItem('vibebudget_v2', JSON.stringify(state)); }

    let myChart;
    function render() {
        document.getElementById('year-label').innerText = `${state.currentYear} Budget Cycle`;
        const grid = document.getElementById('budget-grid');
        grid.innerHTML = state.budgets.map(b => `
            <div class="budget-tile" style="background: ${b.color}44; border-color: ${b.color}" onclick="openBudgetModal(${b.id})">
                <span class="tile-icon">${b.icon}</span>
                <span class="tile-name">${b.name}</span>
                <span class="tile-amt">$${b.balance.toFixed(0)}</span>
            </div>
        `).join('');
        document.getElementById('exp-category').innerHTML = state.budgets.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
        const total = state.budgets.reduce((acc, b) => acc + b.balance, 0);
        const el = document.getElementById('total-remaining');
        el.innerText = `$${total.toFixed(2)}`;
        el.style.color = total < 0 ? 'var(--danger)' : 'var(--text-main)';
        const hist = document.getElementById('history-list');
        hist.innerHTML = '<label>Recent Activity</label>' + state.expenses.slice(0, 10).map(e => {
            const cat = state.budgets.find(b => b.id === e.catId);
            return `
                <div class="history-item">
                    <div>
                        <span style="font-weight:600">${cat ? cat.icon : ''} ${cat ? cat.name : 'Deleted'}</span>
                        <div style="font-size:0.75rem; color:var(--text-sub)">${e.note.replace(/#\w+/g, '')}</div>
                        ${(e.note.match(/#\w+/g) || []).map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>
                    <div style="font-weight:700">-$${e.amt.toFixed(2)}</div>
                </div>
            `;
        }).join('');
        updateChart();
    }

    function updateChart() {
        const ctx = document.getElementById('budgetChart').getContext('2d');
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: state.budgets.map(b => b.name),
                datasets: [{
                    data: state.budgets.map(b => Math.max(0, b.balance)),
                    backgroundColor: state.budgets.map(b => b.color),
                    borderWidth: 0
                }]
            },
            options: { cutout: '75%', plugins: { legend: { display: false } } }
        });
    }

    function resetAll() { if(confirm("Clear all data?")) { localStorage.clear(); location.reload(); } }

    init();
</script>
</body>
</html>
