<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Expense Tracker</title>
    <style>
        :root {
            --bg: #ffffff;
            --card: #f9f9f9;
            --text-main: #111111;
            --text-sub: #666666;
            --border: #eeeeee;
            --accent: #000000;
            --danger: #ff3b30;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); color: var(--text-main); margin: 0; padding: 20px;
            line-height: 1.4; padding-bottom: 40px;
        }

        .container { max-width: 450px; margin: 0 auto; }
        
        header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-end; }
        .year-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-sub); }

        /* Budget Progress Bars */
        .budget-stack { margin-bottom: 30px; }
        .budget-row { margin-bottom: 20px; position: relative; }
        .budget-info { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 6px; }
        .budget-name { font-weight: 700; font-size: 0.95rem; }
        .budget-values { font-size: 0.85rem; font-weight: 500; }
        .budget-values span { color: var(--text-sub); font-weight: 400; }
        
        .progress-bg { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; position: relative; }
        .progress-fill { height: 100%; transition: width 0.6s cubic-bezier(0.2, 0, 0, 1); }
        
        .reorder-btns { position: absolute; right: -5px; top: -25px; display: flex; gap: 5px; opacity: 0.3; }
        .reorder-btns button { width: 24px; height: 24px; padding: 0; font-size: 10px; background: #eee; color: #000; }

        /* Expense Form */
        .form-card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 30px; }
        label { display: block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--text-sub); margin-bottom: 8px; }
        
        input, select { 
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px;
            font-size: 1rem; margin-bottom: 12px; background: #fff; outline: none;
        }

        .tag-cloud { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
        .tag-pill { 
            background: #fff; border: 1px solid var(--border); padding: 4px 10px; 
            border-radius: 20px; font-size: 0.75rem; cursor: pointer; 
        }

        button.primary { 
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            background: var(--accent); color: white; font-weight: 700; font-size: 1rem;
        }

        /* History */
        .history-header { display: flex; justify-content: space-between; align-items: center; margin: 30px 0 15px; }
        .history-item { 
            padding: 16px 0; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        .hist-main { flex: 1; }
        .hist-desc { font-weight: 700; font-size: 1rem; display: block; margin-bottom: 2px; }
        .hist-meta { font-size: 0.75rem; color: var(--text-sub); }
        .hist-tags { display: flex; gap: 4px; margin-top: 4px; }
        .hist-tag { font-size: 0.65rem; background: #f0f0f0; padding: 1px 5px; border-radius: 4px; color: var(--text-sub); }
        .hist-amt { font-weight: 800; font-size: 1rem; margin-left: 15px; }

        .pagination { display: flex; justify-content: center; gap: 20px; margin-top: 20px; align-items: center; }
        .pagination button { background: none; border: 1px solid #ddd; padding: 5px 15px; border-radius: 8px; font-size: 0.8rem; }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: #fff; z-index: 100; padding: 20px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="year-label" id="year-label"></span>
        <button onclick="toggleReorderMode()" style="background:none; border:none; font-size:0.7rem; text-decoration:underline">Edit Order</button>
    </header>

    <!-- Budgets -->
    <div id="budget-stack" class="budget-stack"></div>

    <!-- Add Expense -->
    <div class="form-card">
        <label>Description</label>
        <input type="text" id="exp-note" placeholder="What was it for?">
        
        <label>Quick Tags</label>
        <div id="quick-tags" class="tag-cloud"></div>

        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>Amount</label>
                <input type="number" id="exp-amount" placeholder="0.00" inputmode="decimal">
            </div>
            <div style="flex: 1;">
                <label>Category</label>
                <select id="exp-category"></select>
            </div>
        </div>
        <button class="primary" onclick="addExpense()">Add Expense</button>
    </div>

    <!-- Recent History -->
    <div class="history-header">
        <label style="margin:0">History</label>
        <select id="filter-cat" style="width: auto; margin:0; padding: 5px; font-size: 0.7rem;" onchange="renderHistory(0)">
            <option value="all">All Categories</option>
        </select>
    </div>
    
    <div id="history-list"></div>
    <div id="pagination-controls" class="pagination"></div>

    <button class="primary" style="margin-top:40px; background:#f0f0f0; color:#000" onclick="openBudgetModal()">Manage Budgets</button>
    <button class="primary" style="margin-top:10px; background:none; color:#999; font-size:0.7rem;" onclick="exportToCSV()">Export to Sheets/Excel</button>
</div>

<!-- Manage Budget Modal -->
<div id="budgetModal" class="modal">
    <div style="max-width:400px; margin:0 auto;">
        <h2 id="modal-title">Category Settings</h2>
        <input type="hidden" id="edit-id">
        <label>Name</label>
        <input type="text" id="cat-name">
        <label>Weekly Limit ($)</label>
        <input type="number" id="cat-limit" inputmode="decimal">
        <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:10px; margin:15px 0;" id="color-picker"></div>
        <button class="primary" onclick="saveBudget()">Save</button>
        <button class="primary" id="delete-btn" style="background:var(--danger); margin-top:10px" onclick="deleteBudget()">Delete</button>
        <button class="primary" style="background:#eee; color:#000; margin-top:10px" onclick="closeModal()">Close</button>
    </div>
</div>

<script>
    const COLORS = ['#000000', '#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#71717a', '#a3e635'];
    
    let state = {
        budgets: [],
        expenses: [],
        lastWeeklyReset: null,
        currentYear: new Date().getFullYear(),
        reorderMode: false,
        selectedColor: COLORS[0],
        currentPage: 0
    };

    function init() {
        const saved = localStorage.getItem('vibebudget_v3');
        if (saved) state = JSON.parse(saved);
        if (state.budgets.length === 0) {
            state.budgets = [{ id: 1, name: 'General', limit: 100, balance: 100, color: '#000' }];
        }
        setupColorPicker();
        checkTimeframes();
        renderAll();
    }

    function checkTimeframes() {
        const now = new Date();
        const lastReset = state.lastWeeklyReset ? new Date(state.lastWeeklyReset) : now;
        const weeksPassed = Math.floor((now - lastReset) / (1000 * 60 * 60 * 24 * 7));
        if (weeksPassed > 0 || !state.lastWeeklyReset) {
            state.budgets.forEach(b => b.balance = Number(b.balance) + (Number(b.limit) * (weeksPassed || 1)));
            state.lastWeeklyReset = now.toISOString();
            save();
        }
    }

    // --- Core Logic ---

    function addExpense() {
        const amt = parseFloat(document.getElementById('exp-amount').value);
        const catId = parseInt(document.getElementById('exp-category').value);
        const note = document.getElementById('exp-note').value;
        if (!amt || !catId) return;

        state.expenses.unshift({ id: Date.now(), amt, catId, note, date: new Date().toISOString() });
        const cat = state.budgets.find(b => b.id === catId);
        cat.balance -= amt;

        document.getElementById('exp-amount').value = '';
        document.getElementById('exp-note').value = '';
        save();
        renderAll();
    }

    function getTopTags() {
        const counts = {};
        state.expenses.forEach(e => {
            const tags = e.note.match(/#\w+/g) || [];
            tags.forEach(t => counts[t] = (counts[t] || 0) + 1);
        });
        return Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 6).map(i => i[0]);
    }

    function moveBudget(index, dir) {
        const newIdx = index + dir;
        if (newIdx < 0 || newIdx >= state.budgets.length) return;
        [state.budgets[index], state.budgets[newIdx]] = [state.budgets[newIdx], state.budgets[index]];
        save();
        renderBudgets();
    }

    // --- Rendering ---

    function renderAll() {
        renderBudgets();
        renderQuickTags();
        renderHistory(0);
        
        document.getElementById('year-label').innerText = `${state.currentYear} CYCLE`;
        document.getElementById('exp-category').innerHTML = state.budgets.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
        document.getElementById('filter-cat').innerHTML = '<option value="all">All Categories</option>' + 
            state.budgets.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
    }

    function renderBudgets() {
        const stack = document.getElementById('budget-stack');
        stack.innerHTML = state.budgets.map((b, i) => {
            const perc = Math.max(0, Math.min(100, (b.balance / b.limit) * 100));
            return `
                <div class="budget-row">
                    ${state.reorderMode ? `
                        <div class="reorder-btns">
                            <button onclick="moveBudget(${i}, -1)">▲</button>
                            <button onclick="moveBudget(${i}, 1)">▼</button>
                        </div>
                    ` : ''}
                    <div class="budget-info" onclick="openBudgetModal(${b.id})">
                        <div class="budget-name">${b.name}</div>
                        <div class="budget-values">$${b.balance.toFixed(0)} <span>/ $${b.limit}</span></div>
                    </div>
                    <div class="progress-bg">
                        <div class="progress-fill" style="width: ${perc}%; background: ${b.color}"></div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderQuickTags() {
        const tags = getTopTags();
        const cloud = document.getElementById('quick-tags');
        cloud.innerHTML = tags.map(t => `<div class="tag-pill" onclick="appendTag('${t}')">${t}</div>`).join('');
    }

    function renderHistory(page) {
        state.currentPage = page;
        const filterId = document.getElementById('filter-cat').value;
        const filtered = state.expenses.filter(e => filterId === 'all' || e.catId == filterId);
        
        const start = page * 7;
        const slice = filtered.slice(start, start + 7);
        
        const list = document.getElementById('history-list');
        list.innerHTML = slice.map(e => {
            const cat = state.budgets.find(b => b.id === e.catId);
            const tags = e.note.match(/#\w+/g) || [];
            const desc = e.note.replace(/#\w+/g, '').trim() || 'No description';
            return `
                <div class="history-item">
                    <div class="hist-main">
                        <span class="hist-desc">${desc}</span>
                        <div class="hist-meta">${cat ? cat.name : 'Deleted'} • ${new Date(e.date).toLocaleDateString()}</div>
                        <div class="hist-tags">${tags.map(t => `<span class="hist-tag">${t}</span>`).join('')}</div>
                    </div>
                    <div class="hist-amt">-$${e.amt.toFixed(2)}</div>
                </div>
            `;
        }).join('');

        const controls = document.getElementById('pagination-controls');
        controls.innerHTML = `
            <button onclick="renderHistory(${page-1})" ${page === 0 ? 'disabled' : ''}>Prev</button>
            <span style="font-size:0.8rem">Page ${page + 1}</span>
            <button onclick="renderHistory(${page+1})" ${start + 7 >= filtered.length ? 'disabled' : ''}>Next</button>
        `;
    }

    // --- Helpers ---

    function appendTag(tag) {
        const input = document.getElementById('exp-note');
        input.value = input.value.trim() + " " + tag + " ";
        input.focus();
    }

    function toggleReorderMode() {
        state.reorderMode = !state.reorderMode;
        renderBudgets();
    }

    function setupColorPicker() {
        const cp = document.getElementById('color-picker');
        cp.innerHTML = COLORS.map(c => `<div onclick="state.selectedColor='${c}'" style="background:${c}; height:30px; border-radius:5px; cursor:pointer"></div>`).join('');
    }

    function openBudgetModal(id = null) {
        document.getElementById('budgetModal').style.display = 'block';
        if (id) {
            const b = state.budgets.find(x => x.id == id);
            document.getElementById('edit-id').value = b.id;
            document.getElementById('cat-name').value = b.name;
            document.getElementById('cat-limit').value = b.limit;
            document.getElementById('delete-btn').style.display = 'block';
        } else {
            document.getElementById('edit-id').value = '';
            document.getElementById('cat-name').value = '';
            document.getElementById('cat-limit').value = '';
            document.getElementById('delete-btn').style.display = 'none';
        }
    }

    function saveBudget() {
        const id = document.getElementById('edit-id').value;
        const name = document.getElementById('cat-name').value;
        const limit = parseFloat(document.getElementById('cat-limit').value);
        if (id) {
            const b = state.budgets.find(x => x.id == id);
            Object.assign(b, { name, limit, color: state.selectedColor });
        } else {
            state.budgets.push({ id: Date.now(), name, limit, balance: limit, color: state.selectedColor });
        }
        closeModal(); save(); renderAll();
    }

    function deleteBudget() {
        const id = document.getElementById('edit-id').value;
        if(confirm("Delete budget?")) {
            state.budgets = state.budgets.filter(b => b.id != id);
            closeModal(); save(); renderAll();
        }
    }

    function closeModal() { document.getElementById('budgetModal').style.display = 'none'; }
    function save() { localStorage.setItem('vibebudget_v3', JSON.stringify(state)); }

    function exportToCSV() {
        let csv = "Date,Category,Amount,Description,Tags\n";
        state.expenses.forEach(e => {
            const cat = state.budgets.find(b => b.id === e.catId);
            const tags = (e.note.match(/#\w+/g) || []).join(' ');
            const desc = e.note.replace(/#\w+/g, '').trim().replace(/,/g, '');
            csv += `${new Date(e.date).toLocaleDateString()},${cat ? cat.name : ''},${e.amt},${desc},${tags}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.setAttribute('href', url);
        a.setAttribute('download', 'spending.csv');
        a.click();
    }

    init();
</script>
</body>
</html>
